name: Temporary hidden movement fix

on:
  push:
    branches:
      - dangdinhbaohoang12-patch-2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'dangdinhbaohoang12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dangdinhbaohoang12-patch-2
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Fix non-A* multi-turn hidden occupancy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/src/com/unciv/logic/map/mapunit/movement/UnitMovement.kt")
          text = path.read_text()

          old = '''        val canMoveToCache = HashMap<Tile, Boolean>()'''
          new = '''        val thinksItCanMoveToCache = HashMap<Tile, Boolean>()'''
          if old not in text:
              raise SystemExit("Expected cache declaration was not found")
          text = text.replace(old, new, 1)

          old = '''                    if (!isUnknownTileWeShouldAssumeToBePassable(reachableTile) &&
                        !canMoveToCache.getOrPut(reachableTile) { canMoveTo(reachableTile) })'''
          new = '''                    if (!isUnknownTileWeShouldAssumeToBePassable(reachableTile) &&
                        !thinksItCanMoveToCache.getOrPut(reachableTile) { thinksItCanMoveTo(reachableTile) })'''
          if old not in text:
              raise SystemExit("Expected multi-turn occupancy check was not found")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Compile
        run: ./gradlew classes

      - name: Run checks
        run: ./gradlew check

      - name: Commit fix and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/com/unciv/logic/map/mapunit/movement/UnitMovement.kt
          git rm .github/workflows/.tmp-fix-hidden-movement.yml
          git commit -m "Fix non-A* multi-turn hidden-unit pathing"
          git push origin HEAD:dangdinhbaohoang12-patch-2
